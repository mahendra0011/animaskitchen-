<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Anima's Kitchen</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #faf6f0;
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      .loading-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #24180f;
        text-align: center;
      }
      .logo-img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        box-shadow: 0 10px 25px rgba(226, 92, 29, 0.25);
        margin-bottom: 20px;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
      .app-title {
        font-size: 24px;
        font-weight: 800;
        margin: 0;
        color: #24180f;
      }
      .app-subtitle {
        font-size: 13px;
        color: #e25c1d;
        margin-top: 6px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .spinner {
        margin-top: 32px;
        width: 36px;
        height: 36px;
        border: 3.5px solid rgba(226, 92, 29, 0.2);
        border-top-color: #e25c1d;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
  </head>
  <body>
    <div id="splash" class="loading-splash">
      <img src="logo.png" alt="Anima's Kitchen" class="logo-img" />
      <h1 class="app-title">Anima's Kitchen</h1>
      <p class="app-subtitle">Pure Cow Desi Ghee & Fresh Homemade Thalis</p>
      <div class="spinner"></div>
    </div>

    <script>
      // When opened in Capacitor native webview, connect to the cloud kitchen server
      const targetUrl =
        window.location.origin.includes("localhost") || window.location.origin.includes("http")
          ? window.location.origin
          : "https://animaskitchen.com";

      // Redirect or load seamlessly
      if (window.location.protocol === "file:" || window.location.protocol === "capacitor:") {
        window.location.href = "https://animaskitchen.com";
      }
    </script>
  </body>
</html>
