# Render Blueprint Specification (Separated Frontend & Backend)
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ==============================================================================
  # 1. BACKEND SERVICE (Node API & Database Engine)
  # ==============================================================================
  - type: web
    name: animas-kitchen-backend
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm install --include=dev && npm install @rolldown/binding-linux-x64-gnu@1.2.1 && npm run build:backend
    startCommand: npm run start:backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NITRO_PRESET
        value: node-server
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
