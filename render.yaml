# Render Blueprint Specification (Separated Frontend & Backend)
# Documentation: https://render.com/docs/blueprint-spec
# NOTE: Secrets and Credentials are never hardcoded here.
# Add your secret values securely via the Render Dashboard Environment tab.

services:
  # ==============================================================================
  # 1. BACKEND SERVICE (Node Web Service)
  # ==============================================================================
  - type: web
    name: animas-kitchen-backend
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm install --include=dev && npm install @rolldown/binding-linux-x64-gnu@1.2.1 && npm run build:backend
    startCommand: npm run start:backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NITRO_PRESET
        value: node-server
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_USERNAME
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: RIDER_EMAIL
        sync: false
      - key: RIDER_PASSWORD
        sync: false
      - key: RIDER_NAME
        sync: false
      - key: RIDER_PHONE
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # ==============================================================================
  # 2. FRONTEND SERVICE (Static Web CDN)
  # ==============================================================================
  - type: web
    name: animas-kitchen-frontend
    runtime: static
    buildCommand: npm install --include=dev && npm install @rolldown/binding-linux-x64-gnu@1.2.1 && npm run build:frontend
    staticPublishPath: .output/public
    routes:
      - type: rewrite
        source: /api/*
        destination: https://animas-kitchen-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: VITE_BACKEND_URL
        sync: false
      - key: VITE_APP_NAME
        value: "Anima's Kitchen"
      - key: VITE_APP_TAGLINE
        value: "Hot, Warm, Homemade Indian Food & Tiffin"
      - key: VITE_KITCHEN_LOCATION
        value: "Vikash Nagar, Kurji, Patna, Bihar, India"
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
