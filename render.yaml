  # ==============================================================================
  # 2. FRONTEND SERVICE (Static Web UI / Client CDN)
  # ==============================================================================
  - type: web
    name: animas-kitchen-frontend
    runtime: static
    buildCommand: npm install --include=dev && npm install @rolldown/binding-linux-x64-gnu@1.2.1 && npm run build:frontend
    staticPublishPath: .output/public
    routes:
      # Forward /api requests directly to the dedicated backend service
      - type: rewrite
        source: /api/*
        destination: https://animas-kitchen-backend.onrender.com/api/*
      # Single Page App routing fallback
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: VITE_BACKEND_URL
